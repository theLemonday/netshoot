apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: debug-node
  namespace: kube-system
  labels:
    app: debug-node
spec:
  selector:
    matchLabels:
      app: debug-node
  template:
    metadata:
      labels:
        app: debug-node
    spec:
      hostNetwork: true
      hostPID: true
      tolerations:
        - operator: Exists # Schedule onto tainted control-plane/master nodes
      containers:
        - name: net-debug
          image: ghcr.io/theLemonday/netshoot
          imagePullPolicy: IfNotPresent
          command: ["sleep", "infinity"]
          securityContext:
            privileged: true # Grants full access to host network interfaces and ethtool
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
